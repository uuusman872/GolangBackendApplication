{{define "content"}}
<div class="container">
  <div class="auth-form">
    <h2>Login</h2>

      {{if .Form}}{{with .Form.Errors.Get "generic"}}
        <div class="error-message">
          {{.}}
        </div>
      {{end}}{{end}}

      <form action="/login" method="post" autocomplete="off">
        <div class="form-group">
          <label for="email">Email address:</label>
          <input type="text" id="email" name="email" value="{{if .Form}}{{.Form.Get "email"}}{{end}}" required>
          {{if .Form}}{{with .Form.Errors.Get "email"}}
          <p class="inline-error">{{.}}</p>
          {{end}}{{end}}
        </div> 

        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" required>
          {{if .Form}}{{with .Form.Errors.Get "password"}}
          <p class="inline-error">{{.}}</p>
          {{end}}{{end}}
        </div>

      <button type="submit" class="btn-primary">Login</button>
    </form>

    <p class="auth-link">
      Don't have an account? <a href="/register">Register here</a>
    </p>
  </div>
</div>
{{end}}
